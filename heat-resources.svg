
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 200"
     role="img"
     aria-labelledby="svg-title svg-desc">

  <title id="svg-title">Three Heat Safety Resources</title>
  <desc id="svg-desc">
    A water droplet, shaded shelter, and cooling building
    represent ways to stay safe during Phoenix heat.
  </desc>

  <rect width="600" height="200" rx="12" fill="#f5f5f5"/>

  <!-- Water droplet -->
  <path d="M100 30 C80 65 55 95 55 125
           A45 45 0 0 0 145 125
           C145 95 120 65 100 30Z"
        fill="#2786b5"/>

  <!-- Shade shelter -->
  <path d="M230 95 L300 40 L370 95Z" fill="#8c1d40"/>
  <rect x="250" y="95" width="10" height="65" fill="#404040"/>
  <rect x="340" y="95" width="10" height="65" fill="#404040"/>

  <!-- Cooling building -->
  <rect x="435" y="55" width="110" height="105"
        rx="6" fill="#8c1d40"/>
  <rect x="450" y="70" width="25" height="25" fill="#ffc627"/>
  <rect x="505" y="70" width="25" height="25" fill="#ffc627"/>
  <rect x="478" y="115" width="25" height="45" fill="#ffffff"/>

  <g font-family="Arial, sans-serif"
     font-size="16"
     text-anchor="middle"
     fill="#191919">
    <text x="100" y="185">Water</text>
    <text x="300" y="185">Shade</text>
    <text x="490" y="185">Cooling</text>
  </g>
</svg>
